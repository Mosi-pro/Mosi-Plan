# Gemeinsame Regeln für HTTP und HTTPS
client_max_body_size 12m;
server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;

root /usr/share/nginx/html;

# /internal (MCP für Hermes) ist von außen NICHT erreichbar
location /internal/ { return 404; }

location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;          # Streaming der KI-Antworten (SSE)
    proxy_read_timeout 330s;
}

location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
