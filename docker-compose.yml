# MOSI PLAN – Docker Compose
# Dienste: database, backend, frontend (inkl. Nginx-Reverse-Proxy), hermes (optional über COMPOSE_PROFILES=hermes)
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # Logrotation: max. 30 MB je Container

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mosi
      POSTGRES_USER: mosi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosi -d mosi"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    logging: *logging
    networks: [internal]

  backend:
    build: ./backend
    image: mosi-plan-backend:${MOSI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      database: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mosi:${POSTGRES_PASSWORD}@database:5432/mosi
      DATA_DIR: /data
      HERMES_URL: http://hermes:8642
    volumes:
      - ./data/app:/data
      - ./data/hermes:/data/hermes:ro
    tmpfs: ["/tmp:size=64m"]
    logging: *logging
    networks: [internal]

  frontend:
    build: ./frontend
    image: mosi-plan-frontend:${MOSI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      TLS_MODE: ${TLS_MODE:-selfsigned}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      SERVER_IP: ${SERVER_IP:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./data/certs:/certs
      - ./data/acme:/var/www/acme:ro
    logging: *logging
    networks: [internal]

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    profiles: ["hermes"]
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: ./data/hermes/.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
    volumes:
      - ./data/hermes:/opt/data
    logging: *logging
    networks: [internal]   # kein Port nach außen – nur MOSI-Backend spricht mit Hermes

networks:
  internal: {}
